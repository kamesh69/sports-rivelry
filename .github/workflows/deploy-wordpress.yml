name: Deploy WordPress mu-plugins

on:
  push:
    branches: [main]
    paths:
      - "wordpress/wp-content/mu-plugins/**"
      - "scripts/deploy-hostinger-ftp.py"
      - ".github/workflows/deploy-wordpress.yml"
  workflow_dispatch:

jobs:
  deploy-mu-plugins:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy mu-plugins to Hostinger
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
        run: python3 scripts/deploy-hostinger-ftp.py --mu-only
